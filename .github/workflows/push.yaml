name: Push
on:
  push:
    tags: ['*']
  pull_request:
    branches: [master, main]
permissions:
  contents: read
jobs:
  test-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s tests -p 'test_release*.py' -v
  build-project:
    if: github.event_name == 'pull_request'
    needs: test-release
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
  release:
    if: github.event_name == 'push'
    needs: test-release
    uses: ./.github/workflows/release.yaml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
    permissions:
      contents: write
      actions: read
